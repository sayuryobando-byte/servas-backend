global:
  scrape_interval: 15s

scrape_configs:
  - job_name: servas-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "app:8080" ]

  - job_name: vmagent
    static_configs:
      - targets: [ "localhost:8429" ]

  - job_name: victoriametrics
    static_configs:
      - targets: [ "victoriametrics:8428" ]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: [ "grafana:3000" ]